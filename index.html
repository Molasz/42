<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="42 Barcelona cursus projects by molasz-a — visualized in an interactive mind map."
    />
    <meta name="theme-color" content="#0a0e1a" />
    <title>42 Barcelona — molasz-a</title>
    <style>
      :root {
        --color-primary: #1ae0c8;
        --color-accent: #0a0e1a;
        --color-dark: #051a14;
        --color-text: #7ab5b0;
        --color-border: rgba(26, 224, 200, 0.3);
        --transition-speed: 120ms;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
      }
      body {
        background: linear-gradient(
          135deg,
          #0a0e1a 0%,
          #0f1729 50%,
          #0a0e1a 100%
        );
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-family: ui-sans-serif, system-ui, sans-serif;
        padding: 20px;
        color: var(--color-primary);
      }
      h1 {
        color: var(--color-primary);
        font-size: clamp(12px, 3vw, 16px);
        font-weight: 600;
        letter-spacing: 3px;
        text-transform: uppercase;
        opacity: 0.6;
        margin-bottom: clamp(8px, 2vw, 16px);
        text-align: center;
      }
      #wrap {
        position: relative;
        width: 100%;
        max-width: clamp(300px, min(90vw, 90vh), 900px);
        aspect-ratio: 1;
      }
      svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .nd {
        cursor: pointer;
        transition: all var(--transition-speed);
      }
      .nd circle {
        transition: opacity var(--transition-speed);
      }
      .nd:hover circle,
      .nd:focus-within circle {
        opacity: 0.72;
      }
      .nd:focus-visible {
        outline: 2px solid var(--color-primary);
        outline-offset: 2px;
      }
      #tip {
        position: fixed;
        background: rgba(6, 16, 34, 0.97);
        border: 1px solid var(--color-border);
        border-radius: 10px;
        padding: 11px 15px;
        pointer-events: none;
        opacity: 0;
        transition: opacity var(--transition-speed);
        max-width: 220px;
        z-index: 100;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }
      .tn {
        font:
          700 13px/1.3 ui-sans-serif,
          sans-serif;
        color: var(--color-primary);
        margin-bottom: 3px;
      }
      .tl {
        font:
          600 9px/1 ui-sans-serif,
          sans-serif;
        color: #3d8a80;
        margin-bottom: 7px;
        letter-spacing: 0.6px;
        text-transform: uppercase;
      }
      .td {
        font:
          400 11px/1.6 ui-sans-serif,
          sans-serif;
        color: var(--color-text);
      }
      footer {
        margin-top: clamp(12px, 3vw, 20px);
        font-size: clamp(10px, 2vw, 12px);
        color: rgba(26, 224, 200, 0.3);
        letter-spacing: 2px;
        text-transform: uppercase;
        text-align: center;
      }

      @media (max-width: 480px) {
        body {
          padding: 15px;
        }
        #wrap {
          max-width: 100vw;
        }
        #tip {
          max-width: 180px;
          font-size: 10px;
        }
      }

      @media (max-width: 768px) {
        h1 {
          margin-bottom: 15px;
        }
      }

      @media (min-width: 769px) {
        body {
          padding: 30px;
        }
        h1 {
          margin-bottom: 20px;
        }
      }

      @media (min-width: 1024px) {
        #wrap {
          max-width: 800px;
        }
      }

      @media (min-width: 1440px) {
        #wrap {
          max-width: 900px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <h1>42 Barcelona &mdash; molasz-a</h1>
    <div id="wrap">
      <svg viewBox="0 0 640 640"></svg>
      <div id="tip"></div>
    </div>
    <footer>Click any node to open the repo</footer>

    <script>
      const N = "http://www.w3.org/2000/svg";
      const svg = document.querySelector("svg");
      const tip = document.getElementById("tip");

      const D = [
        {
          x: 320,
          y: 320,
          r: 26,
          lines: ["Libft"],
          fs: 11,
          c: 1,
          lv: 0,
          lbl: "libft",
          desc: "Re-implement the C standard library from scratch — the backbone of every project that follows.",
          repo: "https://github.com/Molasz/42cursus-libft",
        },

        {
          x: 389,
          y: 280,
          r: 26,
          lines: ["ft_printf"],
          fs: 8,
          lv: 1,
          lbl: "ft_printf",
          desc: "Re-implementation of printf using variadic functions — flags, width, precision and justification.",
          repo: "https://github.com/Molasz/42cursus-ft_printf",
        },
        {
          x: 251,
          y: 360,
          r: 26,
          lines: ["get_next", "line"],
          fs: 9,
          lv: 1,
          lbl: "get_next_line",
          desc: "Read any file descriptor one line at a time with a configurable BUFFER_SIZE.",
          repo: "https://github.com/Molasz/42cursus-get_next_line",
        },

        {
          x: 455,
          y: 320,
          r: 26,
          lines: ["push_swap"],
          fs: 8,
          lv: 2,
          lbl: "push_swap",
          desc: "Sort a stack of integers using only two stacks and a minimum number of operations.",
          repo: "https://github.com/Molasz/42cursus-push_swap",
        },
        {
          x: 253,
          y: 437,
          r: 26,
          lines: ["pipex"],
          fs: 11,
          lv: 2,
          lbl: "pipex",
          desc: "Recreate shell pipes using fork, execve and file descriptor redirection.",
          repo: "https://github.com/Molasz/42cursus-pipex",
        },
        {
          x: 253,
          y: 203,
          r: 26,
          lines: ["FdF"],
          fs: 14,
          lv: 2,
          lbl: "FdF",
          desc: "3D wireframe terrain renderer — read elevation maps and project them in isometric 3D using MiniLibX.",
          repo: "https://github.com/Molasz/42cursus-fdf",
        },

        {
          x: 501,
          y: 379,
          r: 26,
          lines: ["philo", "sophers"],
          fs: 9,
          lv: 3,
          lbl: "philosophers",
          desc: "The Dining Philosophers problem — threads, mutexes and deadlock prevention in C.",
          repo: "https://github.com/Molasz/42cursus-philosophers",
        },
        {
          x: 139,
          y: 261,
          r: 26,
          lines: ["mini", "shell"],
          fs: 9,
          lv: 3,
          lbl: "minishell",
          desc: "A fully functional Unix shell with pipes, redirections, heredocs, variable expansion and all builtins.",
          repo: "https://github.com/Molasz/42cursus-minishell",
        },

        {
          x: 243,
          y: 82,
          r: 26,
          lines: ["net", "practice"],
          fs: 9,
          lv: 4,
          lbl: "NetPractice",
          desc: "Network configuration exercises covering subnetting, routing tables and IP addressing.",
          repo: "https://github.com/Molasz",
        },
        {
          x: 522,
          y: 173,
          r: 26,
          lines: ["cub3D"],
          fs: 11,
          lv: 4,
          lbl: "cub3D",
          desc: "Raycasting engine inspired by Wolfenstein 3D — DDA algorithm, textures, minimap, built with MLX42.",
          repo: "https://github.com/Molasz/42cursus-cub3D",
        },
        {
          x: 522,
          y: 467,
          r: 26,
          lines: ["C++", "Modules"],
          fs: 10,
          lv: 4,
          lbl: "C++ Modules",
          desc: "10 modules covering C++98 OOP: Orthodox Canonical Form, polymorphism, templates, STL and exceptions.",
          repo: "https://github.com/Molasz/42cursus-cpp",
        },
        {
          x: 243,
          y: 558,
          r: 26,
          lines: ["Inception"],
          fs: 8,
          lv: 4,
          lbl: "Inception",
          desc: "Docker infrastructure from scratch: NGINX + WordPress + MariaDB, persistent volumes, no pre-built images.",
          repo: "https://github.com/Molasz/42cursus-inception",
        },
        {
          x: 70,
          y: 320,
          r: 26,
          lines: ["webserv"],
          fs: 9,
          lv: 4,
          lbl: "webserv",
          desc: "HTTP/1.1 web server in C++ with config files, virtual hosts, CGI and non-blocking I/O.",
          repo: "https://github.com/Molasz",
        },

        {
          x: 320,
          y: 600,
          r: 26,
          lines: ["ft_trans", "cendence"],
          fs: 7,
          lv: 5,
          lbl: "ft_transcendence",
          desc: "Full-stack Pong platform: Django + PostgreSQL + Vanilla JS + Docker. WebSockets, JWT, 2FA, OAuth and 3D rendering.",
          repo: "https://github.com/Molasz/42cursus-ft_transcendence",
        },
      ];

      const RINGS = [
        { r: 80, lbl: "1" },
        { r: 135, lbl: "2" },
        { r: 190, lbl: "3" },
        { r: 250, lbl: "4" },
        { r: 290, lbl: "5" },
      ];

      function mk(tag, a = {}) {
        const e = document.createElementNS(N, tag);
        for (const [k, v] of Object.entries(a)) e.setAttribute(k, v);
        return e;
      }
      function tx(t, a = {}) {
        const e = mk("text", a);
        e.textContent = t;
        return e;
      }

      // Background
      svg.append(mk("circle", { cx: 320, cy: 320, r: 310, fill: "#0a1628" }));
      svg.append(
        mk("circle", {
          cx: 320,
          cy: 320,
          r: 310,
          fill: "none",
          stroke: "#1ae0c8",
          "stroke-width": 0.4,
          opacity: 0.1,
        }),
      );

      // Orbit rings + level labels
      for (const rg of RINGS) {
        svg.append(
          mk("circle", {
            cx: 320,
            cy: 320,
            r: rg.r,
            fill: "none",
            stroke: "#1ae0c8",
            "stroke-width": 0.7,
            opacity: 0.2,
          }),
        );
        svg.append(
          tx(rg.lbl, {
            x: 320,
            y: 320 - rg.r - 7,
            "text-anchor": "middle",
            "dominant-baseline": "auto",
            fill: "#1ae0c8",
            opacity: 0.35,
            "font-size": 9,
            "font-family": "ui-sans-serif,system-ui,sans-serif",
            "font-weight": "700",
          }),
        );
      }

      // Nodes
      for (const p of D) {
        const g = mk("g", { class: "nd" });
        g.append(
          mk("circle", {
            cx: p.x,
            cy: p.y,
            r: p.r,
            fill: "#1ae0c8",
            stroke: p.c ? "#054a3c" : "#077a62",
            "stroke-width": p.c ? 2.5 : 1.8,
          }),
        );
        const nl = p.lines.length,
          lh = p.fs * 1.35,
          y0 = p.y - ((nl - 1) * lh) / 2;
        for (let i = 0; i < nl; i++) {
          g.append(
            tx(p.lines[i], {
              x: p.x,
              y: y0 + i * lh,
              "text-anchor": "middle",
              "dominant-baseline": "central",
              fill: "#051a14",
              "font-size": p.fs,
              "font-family": "ui-sans-serif,system-ui,sans-serif",
              "font-weight": "700",
            }),
          );
        }
        g.addEventListener("mouseenter", (e) => {
          g.querySelector("circle").setAttribute("opacity", ".72");
          tip.innerHTML = `<div class="tn">${p.lbl}</div><div class="tl">Level ${p.lv}</div><div class="td">${p.desc}</div>`;
          tip.style.opacity = "1";
          mv(e);
        });
        g.addEventListener("mousemove", mv);
        g.addEventListener("mouseleave", () => {
          g.querySelector("circle").removeAttribute("opacity");
          tip.style.opacity = "0";
        });
        g.addEventListener("click", () => window.open(p.repo, "_blank"));
        svg.append(g);
      }
      function mv(e) {
        const r = document.getElementById("wrap").getBoundingClientRect();
        tip.style.left = e.clientX + 16 + "px";
        tip.style.top = e.clientY - 8 + "px";
      }
    </script>
  </body>
</html>
